# Déploiement du backend sur Railway.
#
# Ce fichier vit dans backend/ : dans le service Railway, il faut donc régler
# « Root Directory » sur `backend` (Settings → Source). Sans cela Railway lit la racine du
# dépôt, n'y trouve pas de package.json, et le build échoue avant même de commencer.

[build]
builder = "NIXPACKS"

# Deux détails de cette commande sont contre-intuitifs et méritent d'être expliqués, parce que
# les « corriger » casserait le build :
#
# `npm install` et non `npm ci` : Railway monte un cache à l'intérieur de node_modules
# (/app/node_modules/.cache). Or `npm ci` commence par supprimer node_modules en entier, se
# heurte à ce point de montage et échoue sur `EBUSY: resource busy or locked`. La garantie que
# `npm ci` apportait — un lockfile désynchronisé fait échouer le build — n'est pas perdue pour
# autant : la CI GitHub l'exécute sur chaque PR, donc le lockfile est déjà vérifié avant
# d'arriver ici. Avec un lockfile à jour, `npm install` installe exactement les mêmes versions.
#
# `--include=dev` : Railway définit NODE_ENV=production, ce qui fait ignorer les
# devDependencies à npm — donc ni `nest` ni `typescript`, et `npm run build` échouerait sur
# « nest: not found ». Ce sont des dépendances de compilation : elles sont nécessaires ici,
# et absentes de l'image finale de toute façon.
#
# `prisma generate` est indispensable : le client Prisma est généré, pas versionné.
buildCommand = "npm install --include=dev --no-audit --no-fund && npx prisma generate && npm run build"

[deploy]
# Les migrations tournent avant que la nouvelle version ne reçoive du trafic, et un échec
# annule le déploiement : la version précédente reste en ligne plutôt que d'être remplacée
# par une version dont le schéma ne correspond pas à la base.
#
# `DATABASE_URL=${DIRECT_URL:-$DATABASE_URL}` : le temps de cette commande seulement, Prisma
# est pointé vers la connexion directe. Le moteur de schéma a besoin d'une vraie session
# PostgreSQL (verrous consultatifs, transactions longues) qu'un pooler en mode transaction ne
# fournit pas — et derrière un pooler en mode session, migrations et trafic applicatif se
# disputent le même petit nombre de places, ce qui fait échouer les migrations.
#
# La substitution retombe sur DATABASE_URL quand DIRECT_URL n'est pas définie. C'est
# volontaire : sans pooler (PostgreSQL local ou managé classique), une seule connexion suffit,
# et il ne faut pas qu'une variable oubliée empêche tout déploiement.
preDeployCommand = "DATABASE_URL=${DIRECT_URL:-$DATABASE_URL} npx prisma migrate deploy"

startCommand = "node dist/main"

# Railway ne bascule le trafic que si cette route répond. Elle interroge réellement la base :
# un conteneur qui démarre sans joindre PostgreSQL ne doit pas remplacer une version saine.
healthcheckPath = "/api/health"
healthcheckTimeout = 30

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
